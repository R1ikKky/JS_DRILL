services:
  postgres:
    image: postgres:16-alpine
    container_name: jsdrill_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-rick}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-jsdrill}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rick} -d ${DB_NAME:-jsdrill}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
